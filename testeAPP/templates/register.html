{% extends 'base.html' %}

{% block title %}Registro{% endblock %}

{% block content %}
    <h1>Registro</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrar</button>
    </form>
    <p>Já tem uma conta? <a href="{% url 'login' %}">Faça login aqui.</a></p>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>Não tem uma conta? <a href="{% url 'register' %}">Registre-se aqui.</a></p>
{% endblock %}
